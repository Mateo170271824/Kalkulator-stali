name: Aplikacja iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      # Kompilacja bez podpisu. Taki plik .ipa podpisuje się przy instalacji
      # (np. Sideloadly / AltStore z darmowym Apple ID) albo w Xcode z kontem Apple Developer.
      - name: Budowanie (bez podpisu)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Kalkulator-stali-niepodpisana.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-stali-ipa
          path: Kalkulator-stali-niepodpisana.ipa

      - name: Publikacja do pobrania (Releases)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios --yes --cleanup-tag || true
          gh release create ios Kalkulator-stali-niepodpisana.ipa \
            --title "Kalkulator stali – iOS (wersja ${{ github.run_number }}, bez podpisu)" \
            --notes "Plik wymaga podpisania przy instalacji (Sideloadly / AltStore z Apple ID albo Xcode). Najprościej na iPhonie: Safari → https://mateo170271824.github.io/Kalkulator-stali/ → Udostępnij → Do ekranu początkowego." \
            --target "${{ github.sha }}" --latest=false
