name: Aplikacja Android (APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # Własny klucz z sekretów (jeśli jest) – inaczej klucz z repozytorium.
      - name: Klucz podpisu z sekretów
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Budowanie APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Kalkulator-stali.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-stali-apk
          path: Kalkulator-stali.apk

      - name: Publikacja do pobrania (Releases)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android Kalkulator-stali.apk \
            --title "Kalkulator stali – Android (wersja ${{ github.run_number }})" \
            --notes "Pobierz Kalkulator-stali.apk na telefonie i otwórz plik. Przy pierwszej instalacji Android zapyta o zgodę na instalowanie z tego źródła." \
            --target "${{ github.sha }}" --latest
